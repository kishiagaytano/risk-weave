[project]
name = "risk-weave"
version = "0.1.0"
description = "Credit-risk modeling and approval decisioning for the SAS Hackathon 2026 Student Track"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "scikit-learn", "xgboost", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
